unbind C-b
set-option -g prefix C-n
bind-key C-n send-prefix

bind r refresh-client
bind R source-file ~/.tmux.conf

# Preserve SSH connections when splitting panes. The default %, ", and c
# bindings remain unchanged for predictable non-SSH behavior.
# Vertical split
bind - run-shell 'ssh_target=$(tmux show-window-option -v @remote_ssh 2>/dev/null); \
  if [ -n "$ssh_target" ]; then \
    tmux split-window -v "ssh $ssh_target"; \
  else \
    tmux split-window -v -c "#{pane_current_path}"; \
  fi'

# Horizontal split
bind '|' run-shell 'ssh_target=$(tmux show-window-option -v @remote_ssh 2>/dev/null); \
  if [ -n "$ssh_target" ]; then \
    tmux split-window -h "ssh $ssh_target"; \
  else \
    tmux split-window -h -c "#{pane_current_path}"; \
  fi'

# SSH-aware new window
bind v run-shell 'ssh_target=$(tmux show-window-option -v @remote_ssh 2>/dev/null); \
  if [ -n "$ssh_target" ]; then \
    tmux new-window "ssh $ssh_target"; \
  else \
    tmux new-window -c "#{pane_current_path}"; \
  fi'

set -g mouse on
set-option -g allow-rename off

# Visual tweaks
set -g visual-activity off
set -g visual-silence off
setw -g monitor-activity off

set-option -sg escape-time 10

# onedark-inspired colors
set -g status-style fg="#abb2bf"
set -g status-style bg=default
# Statusline positioning
set -g focus-events on
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-left-length 99
set -g status-right-length 99
# These commands tell Tmux to read the output generated by tpipeline
set -g status-left '#(cat #{socket_path}-#{session_id}-vimbridge)'
set -g status-right '#(cat #{socket_path}-#{session_id}-vimbridge-R)'


setw -g window-status-format " #[fg=#5c6370]#I #[fg=#abb2bf]#W "
setw -g window-status-current-format " #[bg=#61afef,fg=#282c34] #I #[bg=#61afef,fg=#282c34,bold]#W "

setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key f display-popup -E "tmux list-windows -a | fzf | cut -d: -f1-2 | xargs -I {} tmux switch-client -t {}"
# jump to last bell
bind-key b run-shell 'target=$(cat /tmp/tmux-last-bell 2>/dev/null) && tmux switch-client -t "${target%%:*}" && tmux select-window -t "${target%.*}" && tmux select-pane -t "$target"'
bind-key a command-prompt -p "agent:" 'split-window -h -l 27% "${CODING_AGENT:-agy} %1"'
bind-key A command-prompt -p "agent resume:" 'split-window -h -l 27% "${CODING_AGENT:-agy} %1 --continue"'

# Fix for truecolor in neovim
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-terminal "tmux-256color"

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip"

# Enable OSC 52 clipboard passthrough for local and remote terminals
set -s set-clipboard on
set -as terminal-features ',*:clipboard'

# send notifications to Gnome when a bell event occurs in any pane, with details about the
# session, window, pane, and command that triggered it. The notifications can be used to quickly jump to the
# relevant pane using the prefix+b keybinding. Additionally, the monitor-bell option is enabled to ensure that
# Tmux detects bell events, and the bell-action is set to any to allow for custom handling of bell events.

set-hook -g alert-bell 'run-shell -b "$(dirname \"$(readlink -f \"$HOME/.tmux.conf\")\")/tmux-bell-handler.sh \"#{session_name}\" \"#{window_index}\" \"#{pane_index}\" \"#{pane_current_command}\""'
set-window-option -g monitor-bell on
set-option -g bell-action any
set -g extended-keys on
set -g extended-keys-format csi-u
set-environment -g CODING_AGENT pi
